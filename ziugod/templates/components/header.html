{% load static %}
<header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 border-bottom">
    <a href="/" class="d-flex align-items-center rounded-circle">
        <img src="https://cdn-1.webcatalog.io/catalog/hacker-typer/hacker-typer-icon-filled-256.png"
             alt=""
             class="no-select rounded-circle"
             height="90"
             width="90" />
    </a>
    <div class="col-md-3 text-end">
        <div class="d-flex flex-column align-items-center justify-content-center">
            {% if user.is_authenticated %}
                <span class="my-2 no-select">Hello, {{ user.username }}!</span>
                <div class="d-flex flex-row align-items-center justify-content-center">
                    <a href="{% url 'create_note' %}" class="btn btn-outline-light m-2">Create new note</a>
                    <a href="{% url 'logout' %}" class="btn btn-primary m-2">Logout</a>
                </div>
            {% else %}
                <span class="my-2 no-select">Welcome, guest!</span>
                <div class="d-flex flex-row align-items-center justify-content-center">
                    <a href="{% url 'admin' %}" class="btn btn-outline-light m-2">Login</a>
                    <a href="#" class="btn btn-primary m-2">Sign-up</a>
                </div>
            {% endif %}
        </div>
    </div>
</header>
